name: NBA Results

on:
  schedule:
    - cron: "3,18,33,48 17-23,0-9 * * *"   # every 15 min, 1am-5:59pm PH
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-results
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post results
        env:
          WEBHOOK_RESULTS: ${{ secrets.WEBHOOK_RESULTS }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python3 results.py
      - name: Save state
        run: |
          if [ -f results_seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results_seen.json
            git diff --staged --quiet || (git commit -m "Update results state" && git pull --rebase && git push)
          fi
